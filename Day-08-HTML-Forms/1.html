<!doctype html>
<html lang="en">
  <head>
    <title>Job Application form</title>
  </head>
  <body>
    <table
      border="1"
      height="100"
      width="350"
      cellspacing="0"
      cellpadding="0"
      align="left"
    >
      <td>
        <form>
          <h1 align="center">Job Application form</h1>
          <hr />
          <h1 align="center">💼</h1>
          <table
            border="2"
            align="center"
            cellspacing="0"
            cellpadding="0"
            height="100"
            width="300"
          >
            <tr>
              <td width="200">
                <b> <label>Full name:</label></b>
              </td>
              <td><input type="text" /></td>
            </tr>
            <tr>
              <td>
                <b> <label>E-mail:</label></b>
              </td>
              <td><input type="email" /></td>
            </tr>
            <tr>
              <td>
                <b> <label>Phone:</label></b>
              </td>
              <td><input type="number" /></td>
            </tr>
            <tr>
              <td colspan="2">
                <b> <label>Position Applied For:</label></b>
              </td>
              <!-- <td></td> -->
            </tr>
          </table>
          <br />
          <b align="center">Required Documents:</b>
          <b
            ><ul>
              <li>Resume</li>
              <li>Cover Letter</li>
              <li>References</li>
            </ul>
          </b>
          <hr />
          <p align="center">
            <input type="submit" value="submit" />
          </p>
        </form>
      </td>
    </table>

    <table
      border="1"
      height="100"
      width="350"
      cellspacing="0"
      cellpadding="0"
      align="center"
    >
      <td>
        <form>
          <h1 align="center">University Application</h1>
          <hr />
          <h1 align="center">🏫</h1>
          <table
            border="2"
            align="center"
            cellspacing="0"
            cellpadding="0"
            height="100"
            width="300"
          >
            <tr>
              <td width="200">
                <b> <label> Name:</label></b>
              </td>
              <td><input type="text" /></td>
            </tr>
            <tr>
              <td>
                <b> <label>E-mail:</label></b>
              </td>
              <td><input type="email" /></td>
            </tr>
            <tr>
              <td>
                <b> <label>DOB:</label></b>
              </td>
              <td><input type="number" /></td>
            </tr>
            <tr>
              <td colspan="2">
                <b> <label>desired Program:</label></b>
              </td>
              <!-- <td></td> -->
            </tr>
          </table>
          <br />
          <br />
          <b align="center"> Admission Requirements:</b>
          <b
            ><ol type="1">
              <li>Completed Application</li>
              <li>Transcripts</li>
              <li>Personal Statement</li>
            </ol>
          </b>
          <hr />
          <p align="center">
            <input type="submit" value="submit" />
          </p>
        </form>
      </td>
    </table>
  </body>
</html>
