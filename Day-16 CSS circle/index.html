<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #edeaea;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .outer {
        width: 380px;
        height: 380px;
        border: 6px solid royalblue;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(223, 223, 226);
        box-shadow: 0 0 20px rgba(0, 0, 255, 0.3);
      }
      .middle {
        width: 280px;
        height: 280px;
        border: 6px solid red;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(246, 212, 207);
        box-shadow: 0 0 20px rgb(226, 72, 70);
      }
      .inner {
        width: 150px;
        height: 150px;
        border: 5px solid green;
        border-radius: 50%;
        background: rgb(196, 223, 193);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 20px rgb(48, 198, 48);
        color: blue;
        font-weight: bold;
        text-align: center;
        text-shadow: 10px 10px 10px rgb(26, 26, 161);
      }
    </style>
  </head>
  <body>
    <div class="outer">
      <div class="middle">
        <div class="inner">
          FullStack<br />
          Developer
        </div>
      </div>
    </div>
  </body>
</html>
